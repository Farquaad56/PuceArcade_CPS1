[workspace]
resolver = "2"
members = [
    "crates/cps-common",
    "crates/cps-gfx",
    "crates/cps-ym2151",
    "crates/cps-oki",
    "crates/cps-qsound",
    "crates/cps-cart",
    "crates/cps-bus",
    "crates/cps-core",
    "crates/cps-testkit",
    "crates/cps-gui",
]

[workspace.dependencies]
# CPU : crates de l'utilisateur, épinglées par révision (voir ref/cpu-crates/README.md)
puce-m68k = { git = "https://github.com/Farquaad56/CPU-Motorola_68K_Crates_Rust", package = "puce-m68k", rev = "823d9a5ed4f1e5bfd69dc5ee2dbcf6d6154f4bd9" }
puce-z80  = { git = "https://github.com/Farquaad56/CPU-Zilog-Z80_Crates_Rust", package = "puce-z80", rev = "77cf591d28e69a690b2d3dc31edf3b0633e0eb83", features = ["serde"] }
# Frontal JAMMA (PuceArcade_JammaGui_Crates v0.2.0, ADR-002)
puce-jamma     = { git = "https://github.com/Farquaad56/PuceArcade_JammaGui_Crates", package = "puce-jamma", rev = "e3a1acb11a28835c8bb225700670d78d1c96c822" }
puce-jamma-gui = { git = "https://github.com/Farquaad56/PuceArcade_JammaGui_Crates", package = "puce-jamma-gui", rev = "e3a1acb11a28835c8bb225700670d78d1c96c822" }

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1
